name: Research URL Fetcher

# Triggered manually (or by a Claude Code workflow via mcp__github__actions_run_trigger).
# Fetches a list of URLs, extracts text (HTML + PDF), appends results to
# research-logs/fetch-log.xlsx, and commits everything back to the target branch.

on:
  workflow_dispatch:
    inputs:
      urls_json:
        description: 'JSON array of URLs — e.g. ["https://example.com/report.pdf"]'
        required: true
        type: string
      session_id:
        description: 'Label for this research run (used in log and output folder)'
        required: false
        default: 'research'
      output_branch:
        description: 'Branch to commit fetched content back to'
        required: false
        default: 'claude/monthly-ai-work-report-xjbyL'

# Serialize runs on the same branch so the Excel log is never written concurrently.
concurrency:
  group: fetch-runner-${{ github.event.inputs.output_branch }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout output branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.output_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install fetch dependencies
        run: pip install -r scripts/requirements-fetch.txt

      - name: Fetch URLs and write log
        env:
          URLS_JSON: ${{ github.event.inputs.urls_json }}
          SESSION_ID: ${{ github.event.inputs.session_id }}
        run: python scripts/fetch_urls.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research-logs/ fetched-content/
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            TIMESTAMP=$(date -u "+%Y-%m-%d %H:%M UTC")
            git commit -m "fetch: ${{ github.event.inputs.session_id }} -- ${TIMESTAMP}"
            git push origin ${{ github.event.inputs.output_branch }}
          fi
